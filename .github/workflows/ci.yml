name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows first, and not alphabetically: plugin confinement is an AppContainer, which exists
  # only here. A green build on another platform says nothing about whether plugins are actually
  # confined, so this is the job that gates.
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore
        run: dotnet restore

      - name: Build
        # Warnings are errors here as they are locally (Directory.Build.props), so a warning that
        # someone stopped seeing in their editor still stops the build.
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # The Python plugin suites run from inside the .NET suite, which is deliberate: a test
        # nobody executes is documentation, and this repository has been bitten by that before.
        run: dotnet test --no-build --configuration Release --verbosity normal

  # The whole suite, with the sandbox Linux plugins actually run under. Pinned to the release the
  # confinement tests were verified on rather than to whatever ubuntu-latest next points at.
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install bubblewrap
        # Plugins are refused on Linux without it, so without it the confinement tests have
        # nothing to confine. Ubuntu 24.04 also restricts unprivileged user namespaces through
        # AppArmor, which bubblewrap needs when it does not run as root.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Lint the plugins
        # Standard library only at runtime; pyflakes is a check on the source, never a dependency.
        run: |
          python -m pip install pyflakes==4.0.1
          python -m pyflakes plugins

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
